name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go: ["1.25", "1.26"]

    name: Go ${{ matrix.go }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Run tests
        run: make test TEST_FLAGS="-v"

      - name: Run tests with race detector
        run: make test TEST_FLAGS="-race -v"

      - name: Fuzz parser
        run: make fuzz FUZZTIME=30s

  oracle:
    runs-on: ubuntu-latest
    name: Oracle

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: glimt
          POSTGRES_PASSWORD: glimt
          POSTGRES_DB: glimt
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: integration/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: integration

      - name: Corpus is up to date
        run: make corpus && git diff --exit-code integration/testdata/glimt.jsonl

      - name: Fetch the Postgres regression suite
        run: make oracle-corpus

      - name: Oracle and live Postgres
        run: make oracle TEST_FLAGS="-v"
        env:
          GLIMT_PG_DSN: postgres://glimt:glimt@localhost:5432/glimt?sslmode=disable

      - name: Fuzz the oracle
        run: make oracle-fuzz FUZZTIME=30s
